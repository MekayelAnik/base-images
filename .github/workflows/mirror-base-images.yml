name: Mirror Base Images to GHCR

on:
  workflow_dispatch:
    inputs:
      force_mirror:
        description: 'Force mirror even if digests match'
        required: false
        type: boolean
        default: false
  repository_dispatch:
    types: [mirror-base-images]

permissions:
  packages: write
  contents: write

concurrency:
  group: base-images-mirror-${{ github.ref }}
  cancel-in-progress: false

env:
  GHCR_OWNER: ${{ github.repository_owner }}
  # Default images if BASE_IMAGES variable is not set
  DEFAULT_IMAGES: >-
    node:current-alpine,
    node:current-slim,
    node:22-slim,
    golang:1.26-alpine,
    alpine:latest,
    python:3-slim,
    debian:stable-slim

jobs:
  mirror:
    name: Mirror base images
    runs-on: ubuntu-latest
    # One job looping the images, not a job per image: imagetools create is a
    # registry-side copy, so per-image runners bought nothing and cost ~18x the
    # job starts and action downloads.
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR (with retry)
        uses: nick-fields/retry@v4
        env:
          REG_USER: ${{ github.actor }}
          REG_TOKEN: ${{ github.token }}
        with:
          timeout_seconds: 30
          max_attempts: 5
          retry_wait_seconds: 2
          warning_on_retry: true
          shell: bash
          command: |
            set -euo pipefail
            printf '%s' "$REG_TOKEN" | docker login ghcr.io \
              --username "$REG_USER" --password-stdin

      # Failures are deferred to the final step so the README still refreshes
      # when an image fails -- update-readme used to get that from `if: always()`
      # on a separate job.
      - name: Mirror images
        id: mirror
        continue-on-error: true
        env:
          RAW_IMAGES: ${{ vars.BASE_IMAGES || env.DEFAULT_IMAGES }}
          GHCR_OWNER: ${{ github.repository_owner }}
          STATUS_DIR: mirror-status
          FORCE: ${{ github.event.inputs.force_mirror || 'false' }}
        run: bash .github/scripts/mirror-images.sh

      - name: Detect "Used By" from public repos
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GH_PAT_READ_VARS || github.token }}
          OWNER: ${{ github.repository_owner }}
          OUT: used-by.tsv
        run: bash .github/scripts/detect-used-by.sh

      - name: Generate README
        if: always()
        env:
          RAW_IMAGES: ${{ vars.BASE_IMAGES || env.DEFAULT_IMAGES }}
          GHCR_OWNER_RAW: ${{ github.repository_owner }}
          REPO_FULL: ${{ github.repository }}
          STATUS_DIR: mirror-status
          USED_BY_FILE: used-by.tsv
        run: bash .github/scripts/generate-readme.sh

      - name: Commit and push if changed
        if: always()
        shell: bash
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          if git diff --cached --quiet; then
            echo "README unchanged — skipping commit."
            exit 0
          fi
          git commit -m "docs: auto-update README with mirror status"

          MAX_ATTEMPTS=5
          for attempt in $(seq 1 "$MAX_ATTEMPTS"); do
            if git push origin "HEAD:${BRANCH}"; then
              echo "README pushed on attempt ${attempt}."
              exit 0
            fi
            if [[ "$attempt" -eq "$MAX_ATTEMPTS" ]]; then
              break
            fi
            echo "Push rejected on attempt ${attempt}; rebasing on origin/${BRANCH}..."
            if ! git pull --rebase --autostash --strategy-option=theirs origin "${BRANCH}"; then
              git rebase --abort >/dev/null 2>&1 || true
              echo "::error::Rebase failed on attempt ${attempt}"
              exit 1
            fi
            sleep "$(( (RANDOM % 4) + 2 ))"
          done
          echo "::error::Failed to push README after ${MAX_ATTEMPTS} attempts"
          exit 1

      - name: Fail if any image failed to mirror
        if: always() && steps.mirror.outcome == 'failure'
        run: |
          echo "::error::One or more images failed to mirror -- see the Mirror images step"
          exit 1
